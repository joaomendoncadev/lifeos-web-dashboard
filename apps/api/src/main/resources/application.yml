spring:
  application:
    name: lifeos-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5442/lifeos}
    username: ${DATABASE_USER:lifeos}
    password: ${DATABASE_PASSWORD:lifeos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8084}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
lifeos:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
